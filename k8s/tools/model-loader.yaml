# ==============================================================================
#
# Temporary pod used to populate the `model-cache` PVC.
#
# The vision Deployment mounts that PVC readOnly (correctly - a serving container
# has no business writing its own model), so the artifact has to be placed by
# something that mounts it read-write. This pod exists only for that, and is deleted
# afterwards:
#
#   kubectl apply -f k8s/tools/model-loader.yaml
#   kubectl -n cogni-ns cp src/owl/models/cuda/owl2_model.onnx \
#       model-loader:/models/owl2_model.onnx
#   kubectl -n cogni-ns delete pod model-loader
#
# In a real deployment the artifact would arrive from object storage (MinIO) or a
# baked image, not from a workstation; see doc/vision-pipeline.md §6.

apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: model-loader
spec:
  restartPolicy: Never
  # Never schedule this next to the vision worker's GPU request in production.
  containers:
    - name: model-loader
      image: python:3.11-slim
      command: ["sleep", "3600"]
      volumeMounts:
        - name: model-cache
          mountPath: /models
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: industrial-cognition-model-cache
