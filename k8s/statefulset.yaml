# --- K8s Manifests for Industrial Cognition ---
# Goal: Define the minimal K8s deployment for foundational services.

## 1. Database StatefulSet (PostgreSQL)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
data:
  # Password must be base64 encoded!
  postgres-password: <BASE64_ENCODED_PASSWORD>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: cogni_db
        - name: POSTGRES_USER
          value: cogni_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: PGHOST
          value: postgres-service
  # Persistence definition for stable state
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP