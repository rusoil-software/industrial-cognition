# Database ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogni-service-account
  namespace: cogni-ns
---
# Service Definition for the Database
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP