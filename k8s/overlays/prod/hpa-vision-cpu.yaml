#
# CPU-based autoscaling for the vision workers - the DEFAULT.
#
# Mutually exclusive with `../../components/keda`, which scales the same
# Deployment on RabbitMQ queue depth instead. Enable exactly one of the two:
# two controllers writing `spec.replicas` flips the deployment every few seconds.
#
#   default:            resources: [..., hpa-vision-cpu.yaml]
#   queue-depth (KEDA): resources: [...]              # drop this file
#                       components: [../../components/keda]
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: vision
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
    scaleDown:
      # Loading the OWLv2 ONNX session is expensive; scale down reluctantly.
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }
