#
# Autoscaling for the control plane and the capture service.
#
# CPU utilisation is the KISS default and works on any cluster with a
# metrics-server. `minReplicas` mirrors the Deployment's static replica count, so
# adding this file never changes the pod count on its own.
#
# `vision` is deliberately NOT here: its load signal is RabbitMQ queue depth, not
# CPU, so it has two mutually exclusive files - `hpa-vision-cpu.yaml` (the
# default) and `../../components/keda` (queue depth). See doc/k8s.md §7.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: camera
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: camera
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: camera
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # RTSP sessions are expensive to re-establish; scale down very slowly.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }
