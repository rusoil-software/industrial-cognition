# ==============================================================================
#
# Production overlay: full architecture parity and a hardened namespace.
#
#   * Distributed MinIO (4 servers) and the base broker topology are inherited.
#   * Monitoring is ON (Prometheus + Grafana + Loki + Alloy).
#   * Replica ceilings, storage classes and the namespace quota are raised.
#   * Network segmentation is ON (default-deny + explicit allows).
#   * The edge node selectors and /dev devices are patched onto `camera` and
#     `robot`, because only those nodes own the capture card and the RS-485
#     adapter. GPU scheduling is patched onto the vision workers.
#
# Apply with: `kubectl apply -k k8s/overlays/prod`
apiVersion: kustomize.config.k8s.io/v1beta1
