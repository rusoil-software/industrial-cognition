# ==============================================================================
#
# Production overlay: pin storage classes.
#
# The base leaves `storageClassName: ""` (cluster default) so that any cluster
# can render and deploy. A production install should be explicit: a class change
# by the platform team must not silently move PostgreSQL or MinIO onto a
# different performance tier.
#
# ADJUST THESE TO YOUR CLUSTER. `fast-ssd` and `bulk` are conventional names;
# run `kubectl get storageclass` and substitute.
#
# JSON6902 form because the target paths sit inside `volumeClaimTemplates[0]`,
# where a strategic merge would have to restate the whole template.
- op: replace
  path: /spec/volumeClaimTemplates/0/spec/storageClassName
  value: fast-ssd
