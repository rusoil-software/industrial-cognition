#
# Production overlay: the real public hostname.
#
# The base uses `mvm.example.com` so that a render is valid and obviously a
# placeholder. Replace both the host and the TLS secret name with the
# installation's own values; the certificate itself is issued out of band
# (cert-manager, or a Secret copied into `cogni-ns`).
- op: replace
  path: /spec/tls/0/hosts/0
  value: mvm.rusoil.example
- op: replace
  path: /spec/rules/0/host
  value: mvm.rusoil.example
