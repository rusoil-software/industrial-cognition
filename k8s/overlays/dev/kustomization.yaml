# ==============================================================================
#
# Development overlay: everything needed to boot the whole pipeline on a
# single-node cluster (Docker Desktop, kind, k3d, minikube).
#
# What changes versus production:
#   * Single-server MinIO and one `vision` replica (no distributed storage
#     quorum to satisfy, no GPU node required).
#   * Monitoring is OFF - add `components: [../../components/monitoring]` when
#     dashboards are actually wanted locally.
#   * No HPAs, PDBs, ResourceQuota or NetworkPolicies: dev clusters commonly
#     lack a metrics-server, are drained by nobody, and cannot reach the
#     physical RTSP/Modbus network that the production policies are written for.
#   * No edge node selectors, so pods schedule on the one available node.
#   * Small storage requests.
#
# Apply with: `kubectl apply -k k8s/overlays/dev`
apiVersion: kustomize.config.k8s.io/v1beta1
