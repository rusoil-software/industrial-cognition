# ==============================================================================
#
# Dev overlay: shrink every volume request so the stack fits on a laptop disk.
#
# The persistent data is disposable in development, and the production values
# (20Gi / 10Gi / 100Gi) would not fit next to a container runtime.
#
# JSON6902 form: the target sits inside `volumeClaimTemplates[0]`, where a
# strategic merge would have to restate the whole template.
- op: replace
  path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
  value: 2Gi
