#
# Dev overlay: one CPU-only inference worker.
#
# The base asks for 2 replicas at 2Gi/6Gi each, which will not schedule on a
# typical development machine. One replica at 1Gi/4Gi exercises the whole
# RabbitMQ -> worker -> Redis/MinIO path without the footprint.
#
# `OWL2_EXECUTION_PROVIDER` already defaults to `CPUExecutionProvider` in the
# base Deployment and the ConfigMap, so nothing else is needed for CPU-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision
  namespace: cogni-ns
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: vision
          args:
            - "-A"
            - "src.tasks.celery"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency=1"
            - "--prefetch-multiplier=1"
            - "-Q"
            - "vision,vision.priority"
            - "-n"
            - "vision@%h"
          resources:
            requests:
              cpu: 250m
              # One resident ONNX session on the real 293 MiB OWLv2 artifact peaked
              # at 3432 MiB RSS when measured in-cluster (scripts/smoke_inference.py).
              # A 4Gi limit left ~600 MiB of headroom and the container was OOMKilled
              # (exit 137) as soon as anything else loaded a second session. 6Gi is
              # the smallest limit with room for arena growth and a decode spike.
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
