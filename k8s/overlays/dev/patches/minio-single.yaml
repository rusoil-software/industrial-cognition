#
# Dev overlay: collapse the 4-server distributed MinIO (which needs a quorum to
# become Ready) into a single server that is healthy on its own, and point the
# readiness probe at the single-node endpoint instead of the cluster endpoint.
#
# JSON6902 form: a handful of scalar paths change, so a patch list stays clearer
# than a strategic merge restating the whole StatefulSet.
- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/podManagementPolicy
  value: OrderedReady
- op: replace
  # MINIO_VOLUMES is the first env entry of the MinIO container.
  path: /spec/template/spec/containers/0/env/0/value
  value: "http://minio-0.minio-headless.cogni-ns.svc.cluster.local:9000/data"
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
  value: /minio/health/ready
