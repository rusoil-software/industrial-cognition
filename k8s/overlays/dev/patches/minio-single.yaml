#
# Dev overlay: collapse the 4-drive distributed MinIO (which needs a quorum to
# become Ready) into a single server that is healthy on its own.
#
# Three things must change together, which is why they are one patch:
#
#   1. replicas 4 -> 1
#   2. MINIO_VOLUMES must become a *filesystem* path. A single-node server
#      rejects the distributed `http://host:port/data` form outright with
#      `FATAL Invalid command line arguments: use path style endpoint for single
#      node setup`. The base keeps the distributed form because it is the
#      4-replica default.
#   3. the readiness probe must use /minio/health/ready; /minio/health/cluster
#      reports on a quorum that no longer exists.
#
# JSON6902 form: these are scalar paths inside an env list and a probe, where a
# strategic merge would have to restate the whole container.
- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/podManagementPolicy
  value: OrderedReady
- op: replace
  # MINIO_VOLUMES is the first env entry of the MinIO container.
  path: /spec/template/spec/containers/0/env/0/value
  value: "/data"
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
  value: /minio/health/ready
