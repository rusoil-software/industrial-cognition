# The console needs the frame buffer and the WebSocket in the same process that
# serves HTTP. Running capture in the API pod for dev gives one URL, one Service and no
# cross-pod frame plumbing; production keeps capture separate (deployment-camera).
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cogni-ns
  name: api
spec:
  # One replica: two capture loops would enqueue every frame twice, and the frame buffer
  # is per-process anyway.
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          env:
            - name: CAMERA_ENABLED
              value: "1"
            - name: CAMERA_SOURCE
              value: "replay:/app/assets/images/roboflow_test_detect_human_robot.webp"
            - name: CAMERA_ID
              value: "main"
            # This pod *is* the capture process here, so it follows the camera registry the
            # same way the camera Deployment does in production: activating a camera in the
            # console then survives a pod restart instead of reverting to CAMERA_SOURCE.
            - name: CAMERA_REGISTRY_WATCH
              value: "1"
            # CPU inference is ~11 s/frame, so most captured frames are shed by the bounded
            # in-flight window (PIPELINE_MAX_IN_FLIGHT). Capture faster than inference anyway:
            # the console preview shows the newest frame, and 5 FPS is what makes it look
            # like a live camera instead of a slideshow. Raise to 15-25 with a GPU.
            - name: CAMERA_FPS
              value: "5"
            - name: PIPELINE_MAX_IN_FLIGHT
              value: "2"
            # CPU inference here is ~14 s/frame (measured p50 13.7 s), so offering every
            # captured frame only fills the window: ``dropped_capacity`` grew while nothing
            # was wrong. Sample instead - the interval sits just above the measured inference
            # time, so a worker always has one frame in flight, the preview keeps its 5 FPS,
            # and a rising ``dropped_capacity`` means a real problem again. Remove this once
            # inference is faster than the capture cadence.
            - name: PIPELINE_DISPATCH_INTERVAL_SECONDS
              value: "15"
