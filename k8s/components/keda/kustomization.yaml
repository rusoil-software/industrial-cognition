# ==============================================================================
#
# Optional component: queue-depth autoscaling for the vision workers via KEDA.
#
# Kept out of the `prod` overlay's default resource list because it requires the
# KEDA operator and its CRDs to be installed in the cluster - without them any
# `kubectl apply` of this component fails outright.
#
# Enabling it is a resource swap in the overlay, not a delete patch: Kustomize
# components cannot remove objects contributed by the kustomization that includes
# them, so the mutually exclusive CPU HPA is dropped from `resources` instead.
#
#   # Before (CPU-based, the default):
#   #   resources: [..., autoscaling.yaml, hpa-vision-cpu.yaml, ...]
#   #
#   # After (queue-depth):
#   #   resources: [..., autoscaling.yaml, ...]        # no hpa-vision-cpu.yaml
#   components:
#     - ../../components/monitoring
#     - ../../components/keda
#
# See doc/k8s.md §7.
apiVersion: kustomize.config.k8s.io/v1alpha1
