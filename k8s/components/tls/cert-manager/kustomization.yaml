# OPTIONAL cert-manager component. Not referenced by any overlay: applying it to a cluster
# without the cert-manager CRDs fails, so it has to be an explicit choice. See the header of
# issuer.yaml and doc/k8s.md "TLS".
#
#   kubectl apply -k k8s/components/tls/cert-manager

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-ns

resources:
  - issuer.yaml
