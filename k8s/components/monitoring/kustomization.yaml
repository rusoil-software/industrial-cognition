# ==============================================================================
#
# Optional observability component: Prometheus + Grafana + Loki + Alloy.
#
# Add it to an overlay with:
#
#   components:
#     - ../../components/monitoring
#
# A Kustomize *component* (not a base) because it is genuinely optional and must
# be composable into several overlays while still being able to patch the
# objects it depends on - `patches` is a component-only capability, and it is
# what lets this file add the `/grafana` and `/minio` ingress paths without
# duplicating the whole Ingress.
#
# Note on the datasource URL: `grafana/datasources.yaml` points at
# `http://prometheus.cogni-ns.svc.cluster.local:9090`, the in-cluster Service
# name. Kustomize `replacements` cannot rewrite a value embedded inside a YAML
# string without also destroying the rest of the file (its `delimiter` option
# replaces everything after the delimiter), so the URL is a plain literal. An
# environment that renames the namespace overrides it with a `patches` entry in
# its own overlay.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

