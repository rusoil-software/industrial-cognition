#
# Prometheus server.
#
# A StatefulSet (not a Deployment) so the TSDB lives on a volume that follows
# the pod identity. The bundled `prometheus-config` ConfigMap is generated by
# Kustomize from prometheus/prometheus.yml and prometheus/rules/.
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - { name: web, port: 9090, targetPort: web, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: industrial-cognition
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      priorityClassName: industrial-cognition-standard
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The official Prometheus image runs as `nobody` (65534).
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
            - --web.enable-admin-api
          ports:
            - { name: web, containerPort: 9090, protocol: TCP }
          startupProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: prometheus
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""
        resources:
          requests:
            storage: 20Gi
