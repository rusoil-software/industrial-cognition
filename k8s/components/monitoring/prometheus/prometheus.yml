#
# Prometheus configuration.
#
# Scrape strategy:
#   * `kubernetes-pods` discovers every pod in this namespace that carries the
#     `prometheus.io/scrape: "true"` annotation. That annotation is already set
#     by the base Deployments, so application metrics are picked up as soon as
#     the services expose an endpoint - no Prometheus change required.
#   * `kubernetes-services` does the same for annotated Services.
#   * `rabbitmq` scrapes the broker's built-in Prometheus plugin (enabled in
#     statefulset-rabbitmq.yaml), which is the only data service that ships
#     metrics out of the box.
#
# The architecture diagram also lists Redis, MinIO and per-service latency
# histograms. Those endpoints are *not* implemented yet (doc/tasklist.md Stage 3
# "Observability Integration"); the commented jobs below are the exact targets
# to enable once the instrumentation lands, so this file does not have to
# change shape later.
#
# Neither `kubernetes_sd_configs` nor `honor_labels` reference a CRD, so a plain
# Prometheus server is enough - no Prometheus Operator is required.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: industrial-cognition
    environment: production

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cogni-ns]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: replace
        target_label: component
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace

  - job_name: kubernetes-services
    kubernetes_sd_configs:
      - role: service
        namespaces:
          names: [cogni-ns]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          component: rabbitmq

