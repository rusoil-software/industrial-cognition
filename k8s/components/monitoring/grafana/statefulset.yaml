#
# Grafana.
#
# Datasources and dashboards are provisioned from ConfigMaps generated by
# Kustomize, so a dashboard change is a manifest change: the ConfigMap content
# hash changes, the pod rolls, and Grafana reloads from disk on startup. No
# Grafana API calls and no sidecar container are involved.
#
# The previous manifest hard-coded `GF_SECRET: changeme_grafana_secret` - a
# literal secret in version control. The admin credential now comes from the
# generated Secret.
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: grafana
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: grafana
        app.kubernetes.io/part-of: industrial-cognition
    spec:
      serviceAccountName: data-services
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The official Grafana image runs as UID/GID 472.
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: GRAFANA_ADMIN_PASSWORD }
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            # Served behind the /grafana path of the API ingress.
            - name: GF_SERVER_ROOT_URL
              value: "https://mvm.example.com/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_LOG_MODE
              value: "console"
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: grafana
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""
        resources:
          requests:
            storage: 5Gi
