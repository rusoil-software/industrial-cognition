# Grafana dashboard provisioning: tells Grafana to load every dashboard JSON
# found in /var/lib/grafana/dashboards (populated from the `grafana-dashboards`
# ConfigMap) into the "Industrial Cognition" folder.
apiVersion: 1

providers:
  - name: industrial-cognition
    orgId: 1
    folder: "Industrial Cognition"
    folderUid: industrial-cognition
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
