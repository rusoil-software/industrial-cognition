#
# Grafana datasource provisioning.
#
# The `uid`s are explicit (not Grafana-generated) for two reasons:
#   1. Dashboard panels can reference `"datasource": {"uid": "prometheus"}`
#      deterministically.
#   2. The host URL is injected by Kustomize `replacements` (see
#      components/monitoring/kustomization.yaml) so this file is environment
#      independent and no `$DS_*` placeholder survives into the ConfigMap.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.cogni-ns.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      manageAlerts: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.cogni-ns.svc.cluster.local:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
