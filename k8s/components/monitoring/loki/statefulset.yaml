# ==============================================================================
#
# Loki - single-binary log store on the filesystem.
#
# The architecture names Loki for log aggregation but only ever as an
# "optional" observability component, and the documented prototype runs on one
# industrial server (doc/vision.md "Scaling: Current Prototype"). A single
# binary with filesystem storage is therefore the correct shape; the
# microservice/distributed deployment modes would triple the manifest count for
# no functional gain at this scale.
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 3100, targetPort: http, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: loki
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: loki
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: loki
        app.kubernetes.io/part-of: industrial-cognition
    spec:
      serviceAccountName: data-services
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-standard
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The official Loki image runs as UID/GID 10001.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - { name: http, containerPort: 3100, protocol: TCP }
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: loki
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""
        resources:
          requests:
            storage: 20Gi
