#
# Non-secret runtime configuration consumed by every Deployment through
# `envFrom`. See doc/k8s.md §3 for the key/consumer table.
#
# Credentials are intentionally absent: they live in the generated Secret
# `industrial-cognition-secrets` (k8s/base/secrets.env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: industrial-cognition-config
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: config
data:
  # ---------------------------------------------------------------- application
  ENVIRONMENT: "production"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  TZ: "UTC"
  CORS_ORIGINS: '["https://mvm.example.com"]'

  # ------------------------------------------------------------ vision / OWLv2
  # Consumed by src/owl/inference/config.py (pydantic BaseSettings).
  OWL2_MODEL_PATH: "/app/models/owl2_model.onnx"
  OWL2_EXECUTION_PROVIDER: "CPUExecutionProvider"
  OWL2_MAX_BATCH_SIZE: "32"
  MODEL_PATH: "/app/models/owl2_model.onnx"
  MIN_CONFIDENCE_THRESHOLD: "0.75"
  SCALE_FACTOR_MM_PER_UNIT: "3000.0"
  # Tokenised detection prompt, produced once by scripts/encode_text_queries.py.
  # Required: the artifact was exported with random dummy tokens, and feeding
  # padding tokens saturates its fp16 text path (-65504) so nothing is ever
  # detected. See doc/vision-pipeline.md §6.
  OWL2_TEXT_IDS_PATH: "/app/models/text_queries.json"
  # --- vision pipeline (doc/vision-pipeline.md §8) --------------------------
  # `owl2` in production; `synthetic` fabricates detections and is for load tests.
  VISION_BACKEND: "owl2"
  # OWLv2 zero-shot sigmoid scores are typically 0.1-0.4, so the legacy 0.75 above
  # would report nothing found.
  VISION_SCORE_THRESHOLD: "0.25"
  VISION_IOU_THRESHOLD: "0.5"
  VISION_MAX_DETECTIONS: "32"
  VISION_LABELS: "metal_sheet"

  # ------------------------------------------------------- detection persistence
  # Consumed by src/api/detection_sink.py. Sampled on purpose: 60 FPS per camera is not a
  # write rate a database should absorb, and most frames say the same thing. This is
  # history for the console and for Stage 3 analytics, not an audit log - an event shorter
  # than the interval can be missed.
  PERSIST_DETECTIONS: "1"
  PERSIST_MIN_INTERVAL_SECONDS: "1.0"
  PERSIST_ONLY_DETECTIONS: "1"

  # ------------------------------------------------------------- async pipeline
  # Consumed by src/tasks/celery.py.
  CELERY_BROKER_URL: "amqp://cogni:cogni-dev-password@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  CELERY_QUEUES: "vision,vision.priority,vision.results,vision.dlq"
  # Broker-side bounds on the work queues (src/tasks/celery.py::_queue_arguments).
  # The dispatcher already sheds frames when its own window is full, but that only bounds
  # one process: with no consumer the queue grows without limit. Measured cost of getting
  # this wrong: a 41-message backlog produced queue_ms of 353 s, all of it worthless.
  # Queue arguments are immutable in RabbitMQ - changing these needs a one-time queue
  # recreation (scripts/queue-hygiene.sh --force), not just a config change.
  CELERY_QUEUE_MAX_LENGTH: "256"
  CELERY_QUEUE_TTL_SECONDS: "60"
  CELERY_TASK_DEFAULT_QUEUE: "vision"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  # Session memory is per *process*: one ONNX session peaks at ~2 GiB (doc/vision-pipeline.md
  # §16). Replicas x concurrency x 2 GiB is what the node must hold, so concurrency 2 across
  # two replicas is already ~8 GiB of inference alone.
  CELERY_WORKER_CONCURRENCY: "2"

  # ------------------------------------------------------------ data endpoints
  DATABASE_URL: "postgresql+psycopg://cogni:cogni-dev-password@postgres:5432/cogni_db"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cogni_db"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_SECURE: "false"
  MINIO_BUCKET_FRAMES: "frames"
  MINIO_BUCKET_RESULTS: "results"

  # ------------------------------------------------------------------- cameras
  # Comma-separated `id=rtsp-url` pairs, one per physical camera.
  CAMERA_STREAMS: "main=rtsp://192.168.1.10:554/stream1"
  CAMERA_IP: "192.168.1.10"
  CAMERA_PORT: "554"
  DEFAULT_FPS: "30"
  DEFAULT_WIDTH: "1920"
  DEFAULT_HEIGHT: "1080"
  STREAM_CODEC: "h264"

  # -------------------------------------------------------------------- robot
  # Binary Modbus; RS-485 is the authority (doc/conventions.md §3). The TCP
  # fallback is used when MODBUS_HOST is set.
  MODBUS_INTERFACE: "/dev/ttyUSB0"
  MODBUS_BAUD_RATE: "9600"
  MODBUS_SLAVE_ID: "1"
  # No converter is attached yet (doc/robot-interface.md): the MVP runs the
  # in-memory controller. Set to rtu (RS-485) or tcp when hardware exists.
  MODBUS_TRANSPORT: "simulated"
  MODBUS_SIMULATED_LATENCY_MS: "0"
  MODBUS_HOST: ""
  MODBUS_PORT: "502"

  # --------------------------------------------------------------- observability
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
  METRICS_PORT: "9100"
