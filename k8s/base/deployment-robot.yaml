#
# Robot Interface (`src/robot/service.py`, `src/robot/integration_manager.py`):
# bridges detection results to the physical controller over binary Modbus.
#
# HARD CONSTRAINT: this Deployment is a singleton. `doc/conventions.md` §3 makes
# Modbus/RS-485 the single authority for physical interaction; two processes
# writing to the same bus interleave frames and corrupt the protocol. The
# strategy is therefore `Recreate` and the HPA for this component is capped at
# one replica.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: robot
    app.kubernetes.io/part-of: industrial-cognition
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: robot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: robot
        app.kubernetes.io/part-of: industrial-cognition
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: robot
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-standard
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Serial devices are owned by group `dialout` (GID 20) on Debian hosts;
        # overlays patch in the real host GID after `stat -c '%g' <device>`.
        supplementalGroups: [20]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: robot
          image: industrial-cognition/api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: industrial-cognition-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # The RS-485 adapter (`MODBUS_INTERFACE`) is patched in by the
            # overlay for the node that actually owns the bus; the base stays
            # portable so CPU-only clusters can still roll it out.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: robot
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: robot
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: robot
