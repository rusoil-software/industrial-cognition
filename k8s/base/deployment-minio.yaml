# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-cognition-minio
  labels:
    app: industrial-cognition
    component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: industrial-cognition
      component: minio
  template:
    metadata:
      labels:
        app: industrial-cognition
        component: minio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9009"
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        - containerPort: 9001
          name: mc
          protocol: TCP
        - containerPort: 9009
          name: metrics
          protocol: TCP
        args:
        - server
        - /data
        - --console-address
        - ":9009"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: industrial-cognition-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: industrial-cognition-secrets
              key: MINIO_SECRET_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: industrial-cognition-minio-data
---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: industrial-cognition-minio
  labels:
    app: industrial-cognition
    component: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  - port: 9001
    targetPort: 9001
    name: mc
  - port: 9009
    targetPort: 9009
    name: metrics
  selector:
    app: industrial-cognition
    component: minio
---
# MinIO Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: industrial-cognition-minio-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
