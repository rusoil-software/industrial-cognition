# ==============================================================================
#
# RabbitMQ - the message broker carrying the priority queues, the results queue
# and the dead-letter queue described in the architecture diagram.
#
# Scope note (KISS): this StatefulSet runs RabbitMQ as a *replicated-single*
# broker. Multi-node clustering is deliberately not hand-rolled here, because
# correct Erlang clustering (cookie distribution, quorum queues, partition
# handling, safe scale-down) is exactly the problem the official RabbitMQ
# Cluster Operator exists to solve; a shell-scripted approximation would be
# less reliable than a single node. For HA, install the operator and replace
# this object with a `RabbitmqCluster` custom resource - the `rabbitmq` Service
# name, ports and credentials contract that the application consumes stay
# identical, so no Deployment changes are needed. See doc/k8s.md §2.
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - { name: amqp, port: 5672, targetPort: amqp, protocol: TCP }
    - { name: management, port: 15672, targetPort: management, protocol: TCP }
    - { name: prometheus, port: 15692, targetPort: prometheus, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - { name: amqp, port: 5672, targetPort: amqp, protocol: TCP }
    - { name: epmd, port: 4369, targetPort: epmd, protocol: TCP }
    - { name: dist, port: 25672, targetPort: dist, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: rabbitmq
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: rabbitmq-headless
  # See the scope note above: >1 requires the RabbitMQ Cluster Operator.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: rabbitmq
        app.kubernetes.io/part-of: industrial-cognition
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: data-services
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-critical
      terminationGracePeriodSeconds: 120
      # Erlang derives the node name from the hostname; the StatefulSet pod name
      # is stable, so `rabbit@<pod>` stays constant across restarts.
      hostname: rabbitmq
      subdomain: rabbitmq-headless
      securityContext:
        runAsNonRoot: true
        # UID/GID of the rabbitmq user in the official Alpine image.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Erlang cookie must be a regular 0400 file owned by the rabbitmq
        # user. It is copied out of the Secret volume so that the mode can be
        # set, and kept in an emptyDir so the Secret stays read-only.
        - name: erlang-cookie
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /cookie-src/erlang.cookie /cookie/erlang.cookie
              chmod 0400 /cookie/erlang.cookie
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - { name: erlang-cookie-src, mountPath: /cookie-src, readOnly: true }
            - { name: erlang-cookie, mountPath: /cookie }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          # Arguments are appended to the image entrypoint, which already knows
          # how to use RABBITMQ_DEFAULT_USER/PASS and the cookie file above.
          args: ["rabbitmq-server"]
          ports:
            - { name: amqp, containerPort: 5672, protocol: TCP }
            - { name: management, containerPort: 15672, protocol: TCP }
            - { name: epmd, containerPort: 4369, protocol: TCP }
            - { name: dist, containerPort: 25672, protocol: TCP }
            - { name: prometheus, containerPort: 15692, protocol: TCP }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: RABBITMQ_DEFAULT_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: RABBITMQ_DEFAULT_PASS }
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: RABBITMQ_ERLANG_COOKIE }
            # Enable the built-in Prometheus endpoint on 15692.
            - name: RABBITMQ_PROMETHEUS_RETURN_PER_OBJECT_METRICS
              value: "true"
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - name: erlang-cookie
              mountPath: /var/lib/rabbitmq/.erlang.cookie
              subPath: erlang.cookie
              readOnly: true
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: erlang-cookie-src
          secret:
            secretName: industrial-cognition-secrets
            defaultMode: 0400
            items:
              - { key: RABBITMQ_ERLANG_COOKIE, path: erlang.cookie }
        - name: erlang-cookie
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ""
        resources:
          requests:
            storage: 20Gi
