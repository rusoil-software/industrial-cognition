#
# MinIO - S3-compatible object storage for raw frames and inference results.
#
# The architecture diagram specifies a 4-drive distributed deployment, and that
# is exactly what the base manifest encodes: 4 StatefulSet replicas, each with
# its own volume, wired together over the headless Service. All four must be
# Ready before the cluster serves reads/writes (erasure-coding quorum).
#
# For a single-node/dev cluster, `k8s/overlays/dev` patches this down to a
# single server that is healthy on its own. See doc/k8s.md §4.
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 9000, targetPort: http, protocol: TCP }
    - { name: console, port: 9001, targetPort: console, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - { name: http, port: 9000, targetPort: http, protocol: TCP }
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: minio
        app.kubernetes.io/part-of: industrial-cognition
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      serviceAccountName: data-services
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-critical
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The official MinIO image runs as UID/GID 1000.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # `minio/minio` and `minio/mc` no longer resolve on Docker Hub or Quay.
          # Verified with `docker manifest inspect`: both are MISSING while
          # `alpine`, `redis:7-alpine`, `postgres:15-alpine` and
          # `rabbitmq:3.13-management-alpine` all resolve - so it is the
          # upstream repository, not the network or the tag.
          #
          # This is the pullable fallback. It ships the server
          # (`/opt/bitnami/minio/bin/minio`) and the client
          # (`/opt/bitnami/minio-client/bin/mc`, already on PATH), which is why
          # the bucket-init Job below reuses it. A production installation should
          # mirror MinIO into its own registry and pin a digest here - see
          # doc/k8s.md §4.
          image: bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          # The Bitnami entrypoint is bypassed on purpose: it applies its own
          # single-drive defaults that would fight the distributed
          # `MINIO_VOLUMES` set below.
          command: ["/opt/bitnami/minio/bin/minio"]
          # The volume set MUST also be an argv positional, not only
          # `MINIO_VOLUMES`. `minio server` with no positional volume argument
          # fails with `FATAL Invalid command line arguments: use path style
          # endpoint for single node setup` even when MINIO_VOLUMES is set.
          #
          # `$(MINIO_VOLUMES)` is expanded by the kubelet from the env entry
          # below, so the distributed `{0...3}` host form used by the base and
          # the single-node `/data` form used by the dev overlay both work here
          # without duplicating this list.
          args:
            - server
            - "$(MINIO_VOLUMES)"
            - --console-address
            - ":9001"
            - --address
            - ":9000"
          ports:
            - { name: http, containerPort: 9000, protocol: TCP }
            - { name: console, containerPort: 9001, protocol: TCP }
          env:
            - name: MINIO_VOLUMES
              value: "http://minio-{0...3}.minio-headless.cogni-ns.svc.cluster.local:9000/data"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: MINIO_SECRET_KEY }
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://mvm.example.com/minio"
          startupProbe:
            httpGet: { path: /minio/health/live, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /minio/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /minio/health/cluster, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: minio
      spec:
        accessModes: ["ReadWriteOnce"]
        # Omitted on purpose = use the cluster's default StorageClass. storageClassName: ""
        # means NO class, which disables dynamic provisioning and leaves the claim
        # Pending forever on FailedBinding. Overlays that need an explicit class add
        # the field (k8s/overlays/prod/patches/*-storage-class.yaml).
        resources:
          requests:
            storage: 100Gi
---
# Creates the `frames` and `results` buckets that the application writes to.
# Idempotent: `mc mb --ignore-existing`.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: minio
    app.kubernetes.io/part-of: industrial-cognition
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: minio-bucket-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: data-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # Same image as the server: it is the only pullable source of the
          # `mc` client, and `mc` is already on PATH
          # (/opt/bitnami/minio-client/bin/mc).
          image: bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # `mc` persists its alias config under $HOME/.mc, which is not
              # writable here (readOnlyRootFilesystem + a non-root UID). Without
              # this, every call fails with
              # `Unable to save new mc config. open /.mc/...: read-only file system`
              # inside the retry loop, and the Job never completes.
              export MC_CONFIG_DIR=/tmp/mc
              mkdir -p "$MC_CONFIG_DIR"
              until mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                echo "waiting for minio..."; sleep 5
              done
              for bucket in "$MINIO_BUCKET_FRAMES" "$MINIO_BUCKET_RESULTS"; do
                mc mb --ignore-existing "local/${bucket}"
                mc version enable "local/${bucket}" || true
              done
              mc ls local
          envFrom:
            - configMapRef:
                name: industrial-cognition-config
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: MINIO_SECRET_KEY }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
