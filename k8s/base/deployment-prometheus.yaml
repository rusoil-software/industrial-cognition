# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-cognition-prometheus
  labels:
    app: industrial-cognition
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: industrial-cognition
      component: prometheus
  template:
    metadata:
      labels:
        app: industrial-cognition
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.48.1
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports:
        - containerPort: 9090
          name: web
          protocol: TCP
        env:
        - name: PROM_CONFIG_FILE
          value: /etc/prometheus/prometheus.yml
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: prometheus-storage
          mountPath: /prometheus
          readOnly: false
      volumes:
      - name: config
        configMap:
          name: prometheus-config # Assumes a ConfigMap will be created separately
      - name: prometheus-storage
        emptyDir: {}
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: industrial-cognition-prometheus
  labels:
    app: industrial-cognition
    component: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: web
  selector:
    app: industrial-cognition
    component: prometheus
---
# (Note: Requires creating prometheus-config ConfigMap containing the actual scrape jobs targeting all components.)
# This is a placeholder deployment; the actual configuration must be provided via a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
      - job_name: 'api'
        static_configs:
        - targets: ['industrial-cognition-api:80'] # Should point to the service name
      - job_name: 'redis'
        static_configs:
        - targets: ['industrial-cognition-redis:8001'] # Target the metrics port
      # Add targets for camera, vision, robot, minio, etc. here as they become available.
      # Example:
      # - job_name: 'minio'
      #   static_configs:
      #   - targets: ['industrial-cognition-minio:9009']
