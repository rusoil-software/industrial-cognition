#
# PostgreSQL 15 - durable store for detection results and system metadata
# (doc/vision.md "Data Model", migrated with Alembic).
#
# A StatefulSet (not a Deployment) is required: the data directory must follow
# the pod identity so that rescheduling never re-attaches a foreign volume, and
# PVCs must be created per replica via volumeClaimTemplates.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: industrial-cognition
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-cognition
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-cognition
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: industrial-cognition
    spec:
      serviceAccountName: data-services
      automountServiceAccountToken: false
      priorityClassName: industrial-cognition-critical
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID/GID of the `postgres` user inside the official Alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: industrial-cognition-secrets, key: POSTGRES_PASSWORD }
            # Subdirectory, not the mount root: the root contains lost+found and
            # initdb refuses a non-empty PGDATA.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - -c
            - max_connections=200
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=768MB
            - -c
            - wal_level=replica
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: industrial-cognition
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        # Empty -> the cluster's default StorageClass. Overlays pin an explicit
        # class for production (see doc/k8s.md §4).
        storageClassName: ""
        resources:
          requests:
            storage: 20Gi
