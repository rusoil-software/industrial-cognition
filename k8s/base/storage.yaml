#
# Shared model cache for the OWLv2 ONNX artifact.
#
# The artifact is ~300 MB and deliberately git-ignored (`src/owl/models/**`), so
# it is never part of the manifest set. Populate the volume once out-of-band
# (see doc/k8s.md §4); every `vision` replica mounts it read-only.
#
# accessModes is ReadWriteOnce because that is the only mode every CSI driver
# supports. A cluster whose default class offers ReadWriteMany can switch the
# mode in an overlay, which then also allows `vision` to scale past one replica
# without node affinity.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: industrial-cognition-model-cache
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: industrial-cognition
spec:
  accessModes:
    - ReadWriteOnce
  # Empty -> the cluster default. Overlays pin an explicit class.
  # Omitted on purpose = use the cluster default StorageClass. storageClassName: ""
  # means NO class, which disables dynamic provisioning and leaves the claim
  # Pending forever. Overlays pin an explicit class (model-cache-storage-class.yaml).
  resources:
    requests:
      storage: 6Gi
