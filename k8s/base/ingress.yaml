#
# North/south entry point for the MVM control panel and the robot telemetry
# stream.
#
# The previous manifest declared a second `industrial-cognition-api` Service
# inside this file, which collided with the one in deployment-api.yaml and
# targeted port 8080 - a port nothing in the project listens on. There is now
# exactly one `api` Service, created alongside its Deployment.
#
# WebSocket note: `/ws/detections` is long-lived and continuous, so proxy
# buffering is disabled and the read timeout is raised to an hour. Without both
# annotations nginx-ingress buffers the frames and the client sees 502s.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-cognition
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: industrial-cognition
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # The WebSocket upgrade needs a 1.1 client and no connection pinning.
    nginx.ingress.kubernetes.io/websocket-services: "api"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mvm.example.com
      secretName: industrial-cognition-tls
  rules:
    - host: mvm.example.com
      http:
        paths:
          # Longest prefix wins in nginx-ingress, so the WebSocket path is
          # matched before the catch-all.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
