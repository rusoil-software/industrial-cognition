#
# Identity and scheduling priority for every Industrial Cognition workload.
#
# One dedicated ServiceAccount per domain (doc/conventions.md: "Domain
# Isolation"), a Role granting read access to the ConfigMap and Secret that the
# pods consume, and two PriorityClasses so that the data services are evicted
# last during node pressure.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: camera
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: camera
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vision
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: vision
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: robot
automountServiceAccountToken: false
---
# Shared identity for the stateful data services. They do not talk to the API
# server, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-services
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: data
automountServiceAccountToken: false
---
# Prometheus needs list/watch on pods/services/endpoints to discover scrape
# targets. It is the only workload in this namespace that requires RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cogni-ns
---
# Data services (PostgreSQL, RabbitMQ, Redis, MinIO) are evicted last.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: industrial-cognition-critical
  labels:
    app.kubernetes.io/name: industrial-cognition
value: 1000000
globalDefault: false
description: "Industrial Cognition data services (database, broker, cache, object storage)."
---
# Default priority for application workloads.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: industrial-cognition-standard
  labels:
    app.kubernetes.io/name: industrial-cognition
value: 1000
globalDefault: false
description: "Industrial Cognition application workloads (api, camera, vision, robot)."
