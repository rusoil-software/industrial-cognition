#
# Kubernetes namespace for the Industrial Cognition platform.
#
# Every manifest in k8s/base and k8s/overlays declares `namespace: cogni-ns`
# explicitly (rather than relying on the Kustomize `namespace:` transformer) so
# that a rendered manifest is readable and auditable on its own.
apiVersion: v1
kind: Namespace
metadata:
  name: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/part-of: industrial-cognition
    # Baseline Pod Security Standard: no privilege escalation, no host
    # namespaces. `camera` and `robot` opt into the privileged profile only on
    # the edge nodes that actually own the video/serial devices.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
