#
# Daily retention for detection history.
#
# Persistence samples frames (one per camera per second, only frames with detections), which
# bounds the write rate but not the total. On a line that runs for months the table grows
# forever, and the only cure is a job like this one.
#
# It runs the API image because that image already has SQLAlchemy, the driver and the
# maintenance module - no new artifact, and the code it runs is the code the tests cover.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: detection-retention
  namespace: cogni-ns
  labels:
    app.kubernetes.io/name: industrial-cognition
    app.kubernetes.io/component: retention
spec:
  # 03:17 rather than midnight: an arbitrary minute avoids every other daily job in a cluster
  # starting at once.
  schedule: "17 3 * * *"
  timeZone: "Etc/UTC"
  # Never overlap: a slow prune must not race the next one into the same rows.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Clean up finished pods so a daily job does not litter the namespace forever.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: industrial-cognition
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: industrial-cognition/api:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.api.maintenance.retention"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: industrial-cognition-config
                - secretRef:
                    name: industrial-cognition-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
