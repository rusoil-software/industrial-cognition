# k8s/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: owl2-inference
  namespace: ml-services
spec:
  replicas: 3
  selector:
    matchLabels:
      app: owl2-inference
  template:
    metadata:
      labels:
        app: owl2-inference
        version: v1
    spec:
      # Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: inference
          image: registry.example.com/owl2-inference:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OWL2_EXECUTION_PROVIDER
              value: "CPUExecutionProvider"

          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Resource requests and limits
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # Liveness and readiness probes
          livenessProbe:
            httpGet:
              path: /api/v1/inference/owl2/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/v1/inference/owl2/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          # Volume mounts
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/appuser/.cache

      volumes:
        - name: models
          configMap:
            name: owl2-models
        - name: tmp
          emptyDir: { }
        - name: cache
          emptyDir: { }

      # Pod disruption budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - owl2-inference
                topologyKey: kubernetes.io/hostname