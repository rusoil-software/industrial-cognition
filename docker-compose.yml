# Comprehensive Infrastructure Stack for Industrial Cognition System

# =======================================================================
# CORE SERVICES (The necessary infrastructure layer)
# These services manage messaging, state, and persistent storage.
# =======================================================================

services:
  # --- RabbitMQ: The Message Broker ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: industrial-rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-net

  # --- Redis: Caching and State Management ---
  redis:
    image: redis:7-alpine
    container_name: industrial-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  # --- MinIO: Object Storage for Frames/Results ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: industrial-minio
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - core-net

# ===============================================================================
# PROCESSING WORKERS (The consuming services)
# These services read from the message broker and execute logic.
# ===============================================================================

  # --- Celery Worker for Vision Processing ---
  vision:
    # This service will run the Python code that consumes from the queue.
    build:
      context: .
      dockerfile: src/vision/Dockerfile.worker
    container_name: vision-worker
    command: celery -A src.tasks.celery worker --loglevel=info --concurrency=2
    depends_on:
      # Ensure messaging services are ready before workers attempt to connect
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Overrides needed for the worker process
      ENVIRONMENT: ${ENVIRONMENT:-local}
      OWL2_MODEL_PATH: /app/models/owl2_model.onnx
      # Credentials for external services
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CELERY_BROKER_URL: amqp://myuser:mypassword@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    networks:
      - core-net
    # Resource allocation tailored for heavy compute tasks
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sleep", "1"] # Will be replaced by a real worker health check

# ==============================================================================
# API GATEWAY & CONTROL PLANE
# =======================================================================================

  # --- FastAPI API Gateway ---
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Service connection credentials needed by the API layer
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - core-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ======================================================================================
# VOLUMES & NETWORKS
# ======================================================================================

volumes:
  redis_data:
  minio_data:

networks:
  core-net:
    driver: bridge
