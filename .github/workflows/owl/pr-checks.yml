name: PR Checks

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quick sanity check: lint + unit tests only
  # Runs on every commit push to a PR for fast feedback
  # ---------------------------------------------------------------------------
  quick-check:
    name: Quick Check (Lint + Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pr-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-pr-

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        run: |
          pytest tests/owl/ \
            -m "not integration" \
            --tb=short \
            -q

      - name: Comment PR with test summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const body = `${icon} **Quick Check**: ${outcome}\n\nCommit: \`${{ github.sha }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });