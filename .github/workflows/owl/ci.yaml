name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run ruff check
        run: ruff check src tests

      - name: Run ruff format check
        run: ruff format --check src tests

  # ---------------------------------------------------------------------------
  # Unit tests (no model, no network — fast)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-base-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-base-

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Run unit tests
        run: |
          pytest tests/owl/ \
            -m "not integration" \
            --tb=short \
            -q \
            --junitxml=reports/unit-tests.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: reports/coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Integration tests (real ONNX model, cached between runs)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-export-${{ hashFiles('requirements/export.txt', 'requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-export-

      - name: Install all dependencies
        run: |
          pip install -r requirements/export.txt
          pip install -r requirements/dev.txt

      # Cache the HuggingFace model download AND the exported ONNX file.
      # Key includes the model name so a model change busts the cache.
      - name: Cache OWL2 ONNX model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: |
            models/owl2_model.onnx
            ~/.cache/huggingface
          key: ${{ runner.os }}-owlv2-base-patch16-ensemble-onnx-v1

      - name: Export ONNX model (if not cached)
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          python scripts/export_model.py \
            --model owlv2-base \
            --output models/owl2_model.onnx \
            --device cpu \
            --no-optimize

      - name: Run integration tests
        run: |
          pytest tests/inference/test_integration.py \
            --model-path models/owl2_model.onnx \
            -v \
            -s \
            --tb=short \
            --junitxml=reports/integration-tests.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/

  # ---------------------------------------------------------------------------
  # Docker build validation (no push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inference image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: owl2-inference:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build export image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.export
          push: false
          tags: owl2-export:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max