# .github/workflows/build-and-push.yml

name: Build and Push Docker Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/owl/**"
      - "requirements/**"
      - "src/owl/Dockerfile"
      - ".dockerignore"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/owl2-inference:latest
            ${{ secrets.REGISTRY_URL }}/owl2-inference:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/owl2-inference:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/owl2-inference:buildcache,mode=max

      - name: Build export image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.export
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/owl2-export:latest
            ${{ secrets.REGISTRY_URL }}/owl2-export:${{ github.sha }}