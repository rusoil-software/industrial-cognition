#
# Copyright (c), The Rusoil Software Development Team. All rights reserved.
# Licensed under the Apache License, Version 2.0 - see alembic/env.py for the
# full header.
#
# The database URL is deliberately NOT set here: alembic/env.py reads it from
# the DATABASE_URL environment variable, which is how the deployment provides it
# (k8s/base/app-config.yaml, docker-compose.yml). A DSN in version control is a
# credential leak waiting to happen.
#
# Run migrations against a live database with:
#
#   DATABASE_URL='postgresql+psycopg://user:pass@host:5432/db' alembic upgrade head
#
# In Kubernetes the same command runs as the `alembic-upgrade` Job created by
# `k8s/scripts/deploy.sh --migrate`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The separator used by `prepend_sys_path`. Without it Alembic falls back to
# legacy splitting on spaces, commas and colons and emits a DeprecationWarning.
path_separator = os

# Timestamp-prefixed revision filenames keep `ls alembic/versions` in the order
# the migrations were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Replaced by alembic/env.py at runtime.
sqlalchemy.url =

# Fail loudly rather than silently targeting the wrong database.
exit_on_error = true

[post_write_hooks]
# Intentionally empty: a hook that rewrites generated revisions makes review
# diffs noisy, and formatting is a review concern rather than a deployment one.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
