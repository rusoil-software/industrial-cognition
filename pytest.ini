# pytest.ini
[pytest]
asyncio_mode = auto

# Test selection. `pytest` runs everything that needs nothing but PyYAML; the
# markers below opt into the layers that need more:
#
#   pytest -m "not integration"    fast, no external services
#   pytest -m integration          needs the ONNX model (tests/integration)
#   pytest -m db                   needs a reachable PostgreSQL (tests/db)
#
# tests/db skips itself when DATABASE_URL is unset or unreachable, so a bare
# `pytest` on a workstation stays green; CI sets DATABASE_URL to a service
# container.
markers =
    integration: needs the exported OWLv2 ONNX model and a real inference run
    db: needs a reachable PostgreSQL (DATABASE_URL)
